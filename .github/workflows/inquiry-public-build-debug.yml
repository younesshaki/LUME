name: Inquiry public build debug

on:
  push:
    branches:
      - feature/real-vehicle-inquiries

jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run build
