<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://pub-da3069790c6443f883e3991be965f766.r2.dev/LUMElogo.png" data-lume-default-favicon />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        // Keep in step with readThemeMode (src/lib/theme/theme.ts): the
        // visitor's own choice, else the last site's template default, else an
        // older stored value, else dark. A default is never saved as a choice.
        try {
          const isMode = (value) => value === "light" || value === "dark";
          const saved = localStorage.getItem("lume.color-theme.v1");
          const chosen = localStorage.getItem("lume.color-theme.chosen.v1") === "1";
          const siteDefault = localStorage.getItem("lume.color-theme.site-default.v1");
          if (isMode(saved) && chosen) {
            document.documentElement.dataset.theme = saved;
            return;
          }
          if (isMode(siteDefault)) {
            document.documentElement.dataset.theme = siteDefault;
            return;
          }
          if (isMode(saved)) {
            document.documentElement.dataset.theme = saved;
            return;
          }

          // Auto was removed from the public site. Preserve an existing Auto
          // visitor's current appearance once, then store an explicit choice.
          if (saved === "auto") {
            const migrated = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            localStorage.setItem("lume.color-theme.v1", migrated);
            localStorage.setItem("lume.color-theme.chosen.v1", "1");
            document.documentElement.dataset.theme = migrated;
            return;
          }
          document.documentElement.dataset.theme = "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <!--
      The marketplace's images come from R2. Warm that cross-origin connection
      only on Home, where a visitor is most likely to navigate to Vehicles next.
      The inventory API is same-origin in production, so it already reuses the
      document connection and does not need a redundant preconnect. This runs
      before React so it complements (rather than delays) route-intent fetches.
    -->
    <script>
      (() => {
        const isHome = window.location.pathname === "/" || window.location.pathname === "/home";
        if (!isHome) return;

        const candidates = ["%VITE_R2_PUBLIC_BASE_URL%"];
        const seen = new Set();

        for (const candidate of candidates) {
          // Vite preserves unknown placeholders. Ignore those instead of
          // emitting an invalid network hint in environments without an override.
          if (!candidate || candidate.startsWith("%")) continue;

          try {
            const origin = new URL(candidate, window.location.origin).origin;
            if (origin === window.location.origin || seen.has(origin)) continue;
            seen.add(origin);

            const link = document.createElement("link");
            link.rel = "preconnect";
            link.href = origin;
            link.crossOrigin = "anonymous";
            link.dataset.lumeVehiclePreconnect = origin;
            document.head.append(link);
          } catch {
            // A malformed optional public host must never block first paint.
          }
        }
      })();
    </script>
    <link rel="dns-prefetch" href="https://spheqdcagzndypxmqvuh.supabase.co" />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background-color: #000; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background-color: #f4efe5; }
    </style>
    <title>LUME</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
